<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>OfferFlow 投递跟踪</title>
  <style>
    body {
      max-width: 1100px;
      margin: 30px auto;
      padding: 0 20px;
      font-family: system-ui, sans-serif;
    }
    .layout {
      display: grid;
      grid-template-columns: 1fr 1.2fr;
      gap: 24px;
    }
    .card {
      border: 1px solid #ddd;
      border-radius: 8px;
      padding: 14px;
      margin-bottom: 10px;
      cursor: pointer;
      text-align: left;
    }
    .card:hover {
      background: #f7f7f7;
    }
    .status {
      font-weight: 600;
    }
    .event, .task {
      border-left: 3px solid #888;
      padding-left: 12px;
      margin: 10px 0;
    }
    .plan-tools {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 6px;
      margin: 12px 0;
    }
    .plan-message {
      color: #555;
    }
    .draft-box {
      margin: 12px 0 20px;
    }
    .source {
      border-left: 3px solid #4b7bec;
      padding-left: 10px;
      margin: 8px 0 8px 18px;
    }
    .source p {
      color: #555;
    }
    .plan-warning {
      color: #9a6700;
    }
    .excluded {
      border-left: 3px solid #b07d00;
      padding-left: 10px;
      margin: 8px 0;
      color: #665000;
    }
    .create-panel {
      border: 1px solid #ccc;
      border-radius: 10px;
      padding: 16px;
      margin-bottom: 24px;
      background: #fafafa;
    }
    .create-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }
    .create-grid label {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .create-grid .full {
      grid-column: 1 / -1;
    }
    .create-grid input,
    .create-grid textarea {
      box-sizing: border-box;
      width: 100%;
      padding: 8px;
    }
    .jd-preview {
      max-height: 320px;
      overflow: auto;
      padding: 10px;
      background: #fff;
      border: 1px solid #ddd;
      white-space: pre-wrap;
      word-break: break-word;
    }
    .create-message {
      margin-left: 10px;
      color: #555;
    }
    .status-tools,
    .task-form,
    .task-actions {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
      margin: 12px 0;
    }
    .status-tools,
    .task-form {
      padding: 10px;
      background: #f5f7fa;
      border-radius: 8px;
    }
    .status-tools input,
    .status-tools select,
    .task-form input,
    .task-form select,
    .task-form textarea {
      padding: 7px;
      box-sizing: border-box;
    }
    .status-tools input,
    .task-form input {
      min-width: 210px;
    }
    .task-note {
      color: #555;
      margin-left: 12px;
    }
  </style>
</head>
<body>
  <h1>OfferFlow 投递跟踪</h1>
  <p><a href="/static/chat.html">返回 Agent 对话</a></p>
  <section class="create-panel">
    <h2>新建投递</h2>

    <form id="applicationForm">
      <div class="create-grid">
        <label>
          公司
          <input id="createCompany" required maxlength="200">
        </label>

        <label>
          岗位
          <input id="createTitle" required maxlength="200">
        </label>

        <label>
          地点
          <input id="createLocation" maxlength="200">
        </label>

        <label>
          截止时间
          <input id="createDeadline" type="datetime-local">
        </label>

        <label class="full">
          岗位描述与岗位要求
          <textarea
            id="createJdText"
            rows="10"
            required
            minlength="10"
            maxlength="30000"
            placeholder="把 BOSS 等平台复制的岗位描述和岗位要求一起粘贴到这里"
          ></textarea>
        </label>
      </div>

      <p>
        <button id="createApplicationButton" type="submit">
          创建投递
        </button>
        <span
          id="createApplicationMessage"
          class="create-message"
        ></span>
      </p>

      <details>
        <summary>查看解析结果</summary>
        <pre id="createParsePreview" class="jd-preview"></pre>
      </details>
    </form>
  </section>
  <div class="layout">
    <section>
      <h2>全部投递</h2>
      <button id="refresh">刷新</button>
      <div id="applications"></div>
    </section>
    <section>
      <h2>投递详情</h2>
      <div id="detail">选择左侧投递记录。</div>
    </section>
  </div>
  <script>
    const STATUS_LABELS = {
      applied: "已投递",
      assessment: "测评",
      first_interview: "一面",
      second_interview: "二面",
      hr_interview: "HR 面",
      offer: "Offer",
      rejected: "已拒绝",
      withdrawn: "已撤回"
    };

    const STATUS_TRANSITIONS = {
      applied: [
        "assessment",
        "first_interview",
        "rejected",
        "withdrawn"
      ],
      assessment: [
        "first_interview",
        "rejected",
        "withdrawn"
      ],
      first_interview: [
        "second_interview",
        "hr_interview",
        "offer",
        "rejected",
        "withdrawn"
      ],
      second_interview: [
        "hr_interview",
        "offer",
        "rejected",
        "withdrawn"
      ],
      hr_interview: [
        "offer",
        "rejected",
        "withdrawn"
      ],
      offer: [],
      rejected: [],
      withdrawn: []
    };

    const TASK_TYPE_LABELS = {
      skill_gap: "技能补强",
      interview_preparation: "面试准备",
      follow_up: "跟进",
      assessment: "测评"
    };

    const listBox = document.querySelector("#applications");
    const detailBox = document.querySelector("#detail");
    const draftByApplication = new Map();

    async function loadApplications() {
      listBox.textContent = "正在加载……";
      const response = await fetch("/api/applications");
      const data = await response.json();
      listBox.textContent = "";

      if (!data.applications.length) {
        listBox.textContent = "还没有投递记录。";
        return;
      }

      for (const application of data.applications) {
        const button = document.createElement("button");
        button.className = "card";
        button.textContent = [
          `${application.company} · ${application.title}`,
          `${STATUS_LABELS[application.current_status] || application.current_status}`,
          application.deadline
            ? `截止：${new Date(application.deadline).toLocaleString()}`
            : "无截止时间"
        ].join(" | ");
        button.addEventListener("click", () => loadDetail(application.id));
        listBox.appendChild(button);
      }
    }

    const RESOURCE_LABELS = {
      curated_grounded: "人工模板 + 联网来源",
      generated_grounded: "AI 生成 + 联网来源",
      curated_template: "人工模板，未联网验证",
      model_only: "AI 基础建议，未联网验证",
      basic_fallback: "通用步骤骨架"
    };

    const CATEGORY_LABELS = {
      technical_skill: "技术技能",
      tool_skill: "工具技能",
      domain_knowledge: "行业知识",
      experience: "实践经历",
      education: "学历资格",
      certificate: "证书资格",
      soft_skill: "软技能",
      motivation_attitude: "主观态度",
      work_condition: "工作条件",
      non_learning_constraint: "非学习要求",
      unknown: "无法分类"
    };

    function renderDraftPreview(container, draft) {
      container.textContent = "";

      const title = document.createElement("h4");
      title.textContent = "新计划草稿";
      container.appendChild(title);

      for (const plan of draft.items || []) {
        const item = document.createElement("div");
        item.className = "task";
        item.textContent = [
          plan.title,
          CATEGORY_LABELS[plan.category] || plan.category,
          RESOURCE_LABELS[plan.resource_status]
            || plan.resource_status,
          `预计 ${plan.estimated_hours} 小时`
        ].filter(Boolean).join(" | ");
        container.appendChild(item);

        const details = document.createElement("ul");
        for (const [label, value] of [
          ["练习", plan.exercise],
          ["交付物", plan.deliverable],
          ["学习步骤", (plan.steps || []).join("；")],
          [
            "验收标准",
            (plan.acceptance_criteria || []).join("；")
          ]
        ]) {
          const row = document.createElement("li");
          row.textContent = `${label}：${value}`;
          details.appendChild(row);
        }
        container.appendChild(details);

        if (plan.quality_note) {
          const note = document.createElement("p");
          note.textContent = plan.quality_note;
          container.appendChild(note);
        }

        for (const source of plan.sources || []) {
          const sourceBox = document.createElement("div");
          sourceBox.className = "source";

          const link = document.createElement("a");
          link.href = source.url;
          link.target = "_blank";
          link.rel = "noopener noreferrer";
          link.textContent = source.title || source.url;
          sourceBox.appendChild(link);

          if (source.evidence_quote) {
            const quote = document.createElement("p");
            quote.textContent = source.evidence_quote;
            sourceBox.appendChild(quote);
          }

          container.appendChild(sourceBox);
        }
      }

      if ((draft.planning_exclusions || []).length) {
        const excludedTitle = document.createElement("h5");
        excludedTitle.textContent = "未生成学习计划的要求";
        container.appendChild(excludedTitle);

        for (const item of draft.planning_exclusions) {
          const row = document.createElement("div");
          row.className = "excluded";
          row.textContent = [
            item.requirement,
            CATEGORY_LABELS[item.category] || item.category,
            item.reason
          ].filter(Boolean).join(" | ");
          container.appendChild(row);
        }
      }

      if ((draft.resource_errors || []).length) {
        const warning = document.createElement("p");
        warning.className = "plan-warning";
        warning.textContent = (
          "部分外部资料获取失败，相关计划使用了降级方案。"
        );
        container.appendChild(warning);
      }
    }

    async function loadDetail(applicationId) {
      detailBox.textContent = "正在加载……";
      const response = await fetch(`/api/applications/${applicationId}`);
      const data = await response.json();
      const planResponse = await fetch(
        `/api/applications/${applicationId}/learning-plan`
      );
      const planData = await planResponse.json();
      detailBox.textContent = "";

      const title = document.createElement("h3");
      title.textContent = `${data.company} · ${data.title}`;
      detailBox.appendChild(title);

      const summary = document.createElement("p");
      summary.textContent = [
        `状态：${STATUS_LABELS[data.current_status] || data.current_status}`,
        `地点：${data.location || "未填写"}`,
        `要求数量：${data.requirements.length}`
      ].join(" | ");
      detailBox.appendChild(summary);

      const allowedStatuses = (
        STATUS_TRANSITIONS[data.current_status] || []
      );
      const statusTools = document.createElement("div");
      statusTools.className = "status-tools";

      if (allowedStatuses.length) {
        const nextStatus = document.createElement("select");
        nextStatus.setAttribute("aria-label", "下一状态");

        for (const status of allowedStatuses) {
          const option = document.createElement("option");
          option.value = status;
          option.textContent = STATUS_LABELS[status] || status;
          nextStatus.appendChild(option);
        }

        const noteInput = document.createElement("input");
        noteInput.placeholder = "状态备注，例如：收到测评通知";
        noteInput.maxLength = 1000;

        const updateButton = document.createElement("button");
        updateButton.textContent = "更新状态";

        const statusMessage = document.createElement("span");
        statusMessage.className = "plan-message";

        updateButton.addEventListener("click", async () => {
          await updateApplicationStatus(
            applicationId,
            nextStatus.value,
            noteInput.value,
            statusMessage,
            updateButton
          );
        });

        statusTools.append(
          nextStatus,
          noteInput,
          updateButton,
          statusMessage
        );
      } else {
        statusTools.textContent = "该投递已结束，不能继续流转。";
      }

      detailBox.appendChild(statusTools);

      const historyTitle = document.createElement("h4");
      historyTitle.textContent = "状态历史";
      detailBox.appendChild(historyTitle);

      if (!data.history.length) {
        const empty = document.createElement("p");
        empty.textContent = "暂无状态变更。";
        detailBox.appendChild(empty);
      }

      for (const event of data.history) {
        const item = document.createElement("div");
        item.className = "event";
        item.textContent = [
          event.from_status || "创建",
          "→",
          event.to_status,
          event.note,
          new Date(event.created_at).toLocaleString()
        ].filter(Boolean).join(" ");
        detailBox.appendChild(item);
      }

      const tasksTitle = document.createElement("h4");
      tasksTitle.textContent = "关联任务";
      detailBox.appendChild(tasksTitle);

      const taskForm = document.createElement("form");
      taskForm.className = "task-form";

      const taskTitle = document.createElement("input");
      taskTitle.placeholder = "任务标题";
      taskTitle.required = true;
      taskTitle.maxLength = 200;

      const taskType = document.createElement("select");
      taskType.setAttribute("aria-label", "任务类型");

      for (const [value, label] of Object.entries(TASK_TYPE_LABELS)) {
        const option = document.createElement("option");
        option.value = value;
        option.textContent = label;
        taskType.appendChild(option);
      }

      const taskDue = document.createElement("input");
      taskDue.type = "datetime-local";
      taskDue.setAttribute("aria-label", "任务截止时间");

      const taskNote = document.createElement("input");
      taskNote.placeholder = "任务说明，可选";
      taskNote.maxLength = 2000;

      const taskButton = document.createElement("button");
      taskButton.type = "submit";
      taskButton.textContent = "添加任务";

      const taskMessage = document.createElement("span");
      taskMessage.className = "plan-message";

      taskForm.append(
        taskTitle,
        taskType,
        taskDue,
        taskNote,
        taskButton,
        taskMessage
      );
      detailBox.appendChild(taskForm);

      taskForm.addEventListener("submit", async (event) => {
        event.preventDefault();
        await createApplicationTask(
          applicationId,
          taskTitle.value,
          taskType.value,
          taskDue.value,
          taskNote.value,
          taskMessage,
          taskButton
        );
      });

      if (!data.tasks.length) {
        const empty = document.createElement("p");
        empty.textContent = "暂无任务。";
        detailBox.appendChild(empty);
      }

      for (const task of data.tasks) {
        const item = document.createElement("div");
        item.className = "task";
        const text = document.createElement("div");
        text.textContent = [
          task.title,
          TASK_TYPE_LABELS[task.task_type] || task.task_type,
          task.status === "done" ? "已完成" : "待完成",
          task.due_at ? `截止：${new Date(task.due_at).toLocaleString()}` : ""
        ].filter(Boolean).join(" | ");
        item.appendChild(text);

        if (task.note) {
          const note = document.createElement("div");
          note.className = "task-note";
          note.textContent = task.note;
          item.appendChild(note);
        }

        if (task.status !== "done") {
          const actions = document.createElement("div");
          actions.className = "task-actions";

          const completeButton = document.createElement("button");
          completeButton.textContent = "完成任务";

          const completeMessage = document.createElement("span");
          completeMessage.className = "plan-message";

          completeButton.addEventListener("click", async () => {
            await completeApplicationTask(
              applicationId,
              task.id,
              completeMessage,
              completeButton
            );
          });

          actions.append(completeButton, completeMessage);
          item.appendChild(actions);
        }

        detailBox.appendChild(item);
      }

      const planTitle = document.createElement("h4");
      planTitle.textContent = "技能进阶计划";
      detailBox.appendChild(planTitle);

      const planTools = document.createElement("div");
      planTools.className = "plan-tools";

      const hoursInput = document.createElement("input");
      hoursInput.type = "number";
      hoursInput.min = "1";
      hoursInput.max = "40";
      hoursInput.value = "10";
      hoursInput.setAttribute("aria-label", "每周学习时长");

      const generateButton = document.createElement("button");
      generateButton.textContent = "生成联网学习计划";

      const saveButton = document.createElement("button");
      saveButton.textContent = "确认保存学习计划";
      saveButton.disabled = true;

      const planMessage = document.createElement("span");
      planMessage.className = "plan-message";

      planTools.append(
        hoursInput,
        document.createTextNode(" 小时/周 "),
        generateButton,
        saveButton,
        document.createTextNode(" "),
        planMessage
      );
      detailBox.appendChild(planTools);

      const draftBox = document.createElement("div");
      draftBox.className = "draft-box";
      detailBox.appendChild(draftBox);

      generateButton.addEventListener("click", async () => {
        await generateGroundedDraft(
          applicationId,
          Number(hoursInput.value),
          planMessage,
          draftBox
        );
      });

      saveButton.addEventListener("click", async () => {
        await saveGroundedDraft(
          applicationId,
          Number(hoursInput.value),
          planMessage
        );
      });

      async function generateGroundedDraft(
        applicationId,
        availableHours,
        messageBox,
        draftBox
      ) {
        if (!Number.isInteger(availableHours) ||
            availableHours < 1 ||
            availableHours > 40) {
          messageBox.textContent = (
            "每周学习时长必须是 1–40 小时。"
          );
          return;
        }

        messageBox.textContent = (
          "正在搜索资料并生成计划……"
        );
        generateButton.disabled = true;
        saveButton.disabled = true;

        const response = await fetch(
          `/api/applications/${applicationId}`
          + "/learning-plan/grounded-draft",
          {
            method: "POST",
            headers: {
              "Content-Type": "application/json"
            },
            body: JSON.stringify({
              available_hours_per_week: availableHours
            })
          }
        );

        const draft = await response.json();

        if (!response.ok) {
          messageBox.textContent = (
            `生成失败：${draft.detail || "未知错误"}`
          );
          generateButton.disabled = false;
          return;
        }

        draftByApplication.set(applicationId, draft);
        renderDraftPreview(draftBox, draft);
        generateButton.disabled = false;
        saveButton.disabled = false;
        messageBox.textContent = (
          `草稿已生成，共 ${draft.items?.length || 0} 项。`
        );

        console.log("联网计划草稿", draft);
      }

      async function saveGroundedDraft(
        applicationId,
        availableHours,
        messageBox
      ) {
        const draft = draftByApplication.get(applicationId);

        if (!draft || !(draft.items || []).length) {
          messageBox.textContent = (
            "没有可保存的计划草稿，请重新生成。"
          );
          return;
        }

        if (!Number.isInteger(availableHours) ||
            availableHours < 1 ||
            availableHours > 40) {
          messageBox.textContent = (
            "每周学习时长必须是 1–40 小时。"
          );
          return;
        }

        const confirmed = window.confirm(
          "确认保存当前展示的这份学习计划草稿吗？"
        );

        if (!confirmed) {
          return;
        }

        messageBox.textContent = "正在保存学习计划……";

        const response = await fetch(
          `/api/applications/${applicationId}/learning-plan`,
          {
            method: "POST",
            headers: {
              "Content-Type": "application/json"
            },
            body: JSON.stringify({
              available_hours_per_week: availableHours,
              confirmed: true,
              items: draft.items
            })
          }
        );

        const result = await response.json();

        if (!response.ok || !result.ok) {
          messageBox.textContent = (
            `保存失败：${
              result.detail
              || result.message
              || "未知错误"
            }`
          );
          return;
        }

        draftByApplication.delete(applicationId);
        saveButton.disabled = true;
        messageBox.textContent = "学习计划已保存。";
        await loadDetail(applicationId);
      }

      if (!planData.items.length) {
        const empty = document.createElement("p");
        empty.textContent = "暂无学习计划。";
        detailBox.appendChild(empty);
      }

      for (const plan of planData.items) {
        const item = document.createElement("div");
        item.className = "task";
        item.textContent = [
          plan.title,
          `目标等级：${plan.target_level}`,
          `预计 ${plan.estimated_hours} 小时`,
          plan.status
        ].join(" | ");
        detailBox.appendChild(item);

        const details = document.createElement("ul");
        for (const [label, value] of [
          ["练习", plan.exercise],
          ["交付物", plan.deliverable],
          ["学习步骤", (plan.steps || []).join("；")],
          ["验收标准", (plan.acceptance_criteria || []).join("；")]
        ]) {
          const row = document.createElement("li");
          row.textContent = `${label}：${value}`;
          details.appendChild(row);
        }
        detailBox.appendChild(details);

        for (const source of plan.sources || []) {
          const sourceBox = document.createElement("div");
          sourceBox.className = "source";

          const link = document.createElement("a");
          link.href = source.url;
          link.target = "_blank";
          link.rel = "noopener noreferrer";
          link.textContent = source.title || source.url;
          sourceBox.appendChild(link);

          if (source.evidence_quote) {
            const quote = document.createElement("p");
            quote.textContent = source.evidence_quote;
            sourceBox.appendChild(quote);
          }

          detailBox.appendChild(sourceBox);
        }
      }
    }

    async function updateApplicationStatus(
      applicationId,
      newStatus,
      note,
      messageBox,
      button
    ) {
      button.disabled = true;
      messageBox.textContent = "正在更新状态……";

      try {
        const response = await fetch(
          `/api/applications/${applicationId}/status`,
          {
            method: "PATCH",
            headers: {
              "Content-Type": "application/json"
            },
            body: JSON.stringify({
              new_status: newStatus,
              note: note.trim()
            })
          }
        );

        const result = await response.json();

        if (!response.ok) {
          throw new Error(formatApiError(result));
        }

        messageBox.textContent = "状态更新成功。";
        await loadApplications();
        await loadDetail(applicationId);
      } catch (error) {
        messageBox.textContent = `更新失败：${error.message}`;
      } finally {
        button.disabled = false;
      }
    }


    async function createApplicationTask(
      applicationId,
      title,
      taskType,
      dueAt,
      note,
      messageBox,
      button
    ) {
      if (!title.trim()) {
        messageBox.textContent = "任务标题不能为空。";
        return;
      }

      button.disabled = true;
      messageBox.textContent = "正在添加任务……";

      try {
        const response = await fetch(
          `/api/applications/${applicationId}/tasks`,
          {
            method: "POST",
            headers: {
              "Content-Type": "application/json"
            },
            body: JSON.stringify({
              title: title.trim(),
              task_type: taskType,
              due_at: dueAt || null,
              note: note.trim()
            })
          }
        );

        const result = await response.json();

        if (!response.ok) {
          throw new Error(formatApiError(result));
        }

        messageBox.textContent = "任务已添加。";
        await loadDetail(applicationId);
      } catch (error) {
        messageBox.textContent = `添加失败：${error.message}`;
      } finally {
        button.disabled = false;
      }
    }


    async function completeApplicationTask(
      applicationId,
      taskId,
      messageBox,
      button
    ) {
      button.disabled = true;
      messageBox.textContent = "正在完成任务……";

      try {
        const response = await fetch(
          `/api/applications/${applicationId}/tasks/${taskId}`,
          {
            method: "PATCH"
          }
        );

        const result = await response.json();

        if (!response.ok) {
          throw new Error(formatApiError(result));
        }

        await loadDetail(applicationId);
      } catch (error) {
        messageBox.textContent = `操作失败：${error.message}`;
        button.disabled = false;
      }
    }


    function formatApiError(data) {
      const detail = data?.detail;

      if (typeof detail === "string") {
        return detail;
      }

      if (detail?.message) {
        return detail.message;
      }

      return JSON.stringify(detail || data);
    }


    async function createApplicationFromForm(event) {
      event.preventDefault();

      const button = document.querySelector(
        "#createApplicationButton"
      );
      const message = document.querySelector(
        "#createApplicationMessage"
      );
      const preview = document.querySelector(
        "#createParsePreview"
      );
      const company = document.querySelector(
        "#createCompany"
      ).value.trim();
      const title = document.querySelector(
        "#createTitle"
      ).value.trim();
      const location = document.querySelector(
        "#createLocation"
      ).value.trim();
      const deadline = document.querySelector(
        "#createDeadline"
      ).value;
      const description = document.querySelector(
        "#createJdText"
      ).value.trim();

      button.disabled = true;
      message.textContent = "正在解析岗位要求……";

      try {
        const parseResponse = await fetch(
          "/api/jobs/parse",
          {
            method: "POST",
            headers: {
              "Content-Type": "application/json"
            },
            body: JSON.stringify({
              description: [
                `公司：${company}`,
                `岗位：${title}`,
                location ? `地点：${location}` : "",
                description
              ].filter(Boolean).join("\n\n")
            })
          }
        );
        let parsed = {
          requirements: []
        };
        let parseWarning = "";

        if (parseResponse.ok) {
          parsed = await parseResponse.json();
          preview.textContent = JSON.stringify(parsed, null, 2);
        } else {
          const parseError = await parseResponse.json();
          parseWarning = formatApiError(parseError);
          preview.textContent = (
            `岗位要求解析失败：${parseWarning}`
          );
        }

        message.textContent = "正在创建投递……";

        const createResponse = await fetch(
          "/api/applications",
          {
            method: "POST",
            headers: {
              "Content-Type": "application/json"
            },
            body: JSON.stringify({
              company,
              title,
              location: location || null,
              deadline: deadline || null,
              description,
              requirements: parsed.requirements || []
            })
          }
        );
        const data = await createResponse.json();

        if (!createResponse.ok) {
          throw new Error(formatApiError(data));
        }

        message.textContent = (
          parseWarning
            ? (
              `投递已创建，但岗位要求解析失败：`
              + `${parseWarning}`
            )
            : `创建成功，投递 ID：${data.application_id}`
        );

        document.querySelector("#applicationForm").reset();

        await loadApplications();
        await loadDetail(data.application_id);
      } catch (error) {
        message.textContent = `操作失败：${error.message}`;
      } finally {
        button.disabled = false;
      }
    }


    document
      .querySelector("#applicationForm")
      .addEventListener("submit", createApplicationFromForm);

    document.querySelector("#refresh").addEventListener("click", loadApplications);
    loadApplications();
  </script>
</body>
</html>
